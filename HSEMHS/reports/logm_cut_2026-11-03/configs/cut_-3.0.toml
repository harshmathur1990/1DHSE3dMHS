# mhs-poisson-logm at logm_cut = -3.0, all else default
[run]
mode = "mhs-poisson-logm"
output = "out/logm_cut_2026-11-03/cut_-3.0.h5"
overwrite = true
[input]
file = "../IO/input-mhs-logm.nc"
[physics]
g = 274.0
[eos]
table_file = "cache/eos_table_fullz.h5"
[tau_grid]
align = "ptot"
[poisson]
logm_cut = -3.0
