# mhs-poisson-ltau on halpha_output/input-mhs-ltau.nc, mu = 0.5, true 3-D (inclined) geometry, azimuth 0
[run]
mode = "mhs-poisson-ltau"
output = "out/modes/halpha_mu05_inclined.h5"
overwrite = true

[input]
file = "/mn/stornext/d9/data/harshm/halpha_output/input-mhs-ltau.nc"

[physics]
g = 274.0

[eos]
table_file = "cache/eos_table_fullz.h5"

[tau_grid]
align = "ptot"

[view]
mu = 0.5
azimuth_deg = 0.0
geometry = "inclined"

[poisson]
logtau_cut = -4.0
max_steps = 100
rtol = 1.0e-4
dc_cap_m = 3.0e5
