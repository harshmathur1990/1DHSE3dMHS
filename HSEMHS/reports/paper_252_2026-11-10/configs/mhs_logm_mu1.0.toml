[run]
mode = "mhs-poisson-logm"
output = "out/paper_252_2026-11-10/mhs_logm_mu1.0.h5"
overwrite = true
[input]
file = "../IO/tau252/input_logm_mu1.0.nc"
[physics]
g = 274.0
[eos]
table_file = "cache/eos_table_fullz.h5"
[tau_grid]
align = "ptot"
[poisson]
stop = "gn"
lm = "gain"
forcing = "ew"
precond = "switch"
cg_cap = 200
gn_tol = 1.0e-3
max_steps = 100
logm_cut = -0.5
