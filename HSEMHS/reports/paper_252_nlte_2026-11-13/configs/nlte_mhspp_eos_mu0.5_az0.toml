[run]
mode = "mhs-poisson-ltau"
output = "out/paper_252_nlte_2026-11-13/nlte_mhspp_eos_mu0.5_az0.h5"
overwrite = true
[input]
file = "../IO/tau252_nlte/input_eos_mu0.5_az0.nc"
[physics]
g = 274.0
[eos]
model = "nlte"
nlte_table_file = "cache/eos_table_nlte.h5"
table_file = "cache/eos_table_fullz.h5"
[tau_grid]
align = "ptot"
[view]
mu = 0.5
azimuth_deg = 0
geometry = "plane_parallel"
[poisson]
stop = "gn"
lm = "gain"
forcing = "ew"
precond = "switch"
cg_cap = 200
gn_tol = 1.0e-3
max_steps = 100
logtau_cut = -4.0
