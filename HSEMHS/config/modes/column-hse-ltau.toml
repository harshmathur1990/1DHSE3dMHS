# column-hse-ltau: hydrostatic columns on the log10 τ500 grid of an inversion-like input (P(τ), z(τ), ρ(τ)), aligned so
# that P + B²/2μ₀ is equal at one height, mean z(τ = 1) = 0. Input in SI, h5py (x, y, τ), no coordinates.
[run]
mode = "column-hse-ltau"
output = "out/modes/column-hse-ltau.h5"
overwrite = true

[input]
file = "../IO/input-mhs-ltau.nc"

[physics]
g = 274.0

[eos]
table_file = "cache/eos_table_fullz.h5"

[tau_grid]
align = "ptot"
