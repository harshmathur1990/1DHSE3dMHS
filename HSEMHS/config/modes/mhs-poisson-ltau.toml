# mhs-poisson-ltau: column HSE in τ, then one Gauss–Newton (Levenberg–Marquardt) solve directly on the τ grid for
# ln P(τ) below log10 τ = logtau_cut and one height per column (heights from z = c + Σ −τ/χ d ln τ).
[run]
mode = "mhs-poisson-ltau"
output = "out/modes/mhs-poisson-ltau.h5"
overwrite = true

[input]
file = "../IO/input-mhs-ltau.nc"

[physics]
g = 274.0

[eos]
table_file = "cache/eos_table_fullz.h5"

[tau_grid]
align = "ptot"

[poisson]
logtau_cut = -4.0                 # vertical depth of the cut (cut_frame = "vertical")
# defaults: max_steps 25, stop "gn" (gn_tol 1e-3 on 2 steps, then the qualified stop check), lm "alpha",
# forcing "fixed", precond "fourier". The D2 benchmark settings with the faster opt-in preconditioner:
# lm = "gain"
# forcing = "ew"
# precond = "switch"

# [view]                          # line of sight (default: vertical, mu = 1); see the root README
# mu = 0.3
# azimuth_deg = 0.0
# geometry = "inclined"
