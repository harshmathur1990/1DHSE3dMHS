# column-hse-logm: hydrostatic columns on a log10 column-mass grid: P = μ g m, z(m) from dz = −dm/ρ, τ₅₀₀(m) computed;
# aligned so that P + B²/2μ₀ is equal at one height, mean z(τ = 1) = 0. Input as the tau-grid inputs with log10m in place of
# log10tau500 (m in kg m⁻², or a units attribute "g cm-2").
[run]
mode = "column-hse-logm"
output = "out/modes/column-hse-logm.h5"
overwrite = true

[input]
file = "../IO/tau252/input_logm_mu1.0.nc"

[physics]
g = 274.0

[eos]
table_file = "cache/eos_table_fullz.h5"

[tau_grid]
align = "ptot"
